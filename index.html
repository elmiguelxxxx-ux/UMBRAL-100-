    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&family=Lexend:wght@400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <meta name="description" content="Plataforma de estudio y aprendizaje activo con visor de documentos, canvas infinito, flashcards FSRS y War Log." />
    <meta property="og:title" content="Umbral — Estudio & Aprendizaje Activo" />
    <meta property="og:description" content="Plataforma de estudio y aprendizaje activo con visor de documentos, canvas infinito, flashcards FSRS y War Log." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('umbral-theme');
          if (t === 'dark') {
            document.documentElement.dataset.theme = 'dark';
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.dataset.theme = 'light';
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
